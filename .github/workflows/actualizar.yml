name: Robot de noticias — Pacto de Valledupar

on:
  schedule:
    - cron: '7,37 * * * *'    # cada 30 minutos
  workflow_dispatch:          # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: robot-noticias
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar noticias nuevas
        run: node scripts/actualizar.mjs

      - name: Guardar cambios
        run: |
          git config user.name "Robot Vibras Positivas HM"
          git config user.email "actions@github.com"
          git add data/noticias.json
          git diff --cached --quiet && exit 0
          git commit -m "Noticias actualizadas $(TZ=America/Bogota date '+%Y-%m-%d %H:%M') (hora Colombia)"
          git push
